<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hız Göstergesi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  /* ========== WELCOME SCREEN ========== */
  .welcome {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #0a0a0f 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s, transform 0.8s;
  }
  .welcome.hide {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }
  .welcome-gauge {
    width: 200px; height: 200px;
    position: relative;
  }
  .welcome-gauge canvas { width: 200px; height: 200px; }
  .welcome-title {
    font-size: 28px;
    font-weight: 700;
    margin-top: 20px;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(0,200,255,0.4);
  }
  .welcome-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .welcome-start {
    margin-top: 30px;
    background: linear-gradient(135deg, #00c8ff, #0060dd);
    border: none;
    color: #fff;
    padding: 14px 44px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.2s, box-shadow 0.3s;
  }
  .welcome-start:hover {
    transform: scale(1.04);
    box-shadow: 0 0 30px rgba(0,200,255,0.5);
  }
  .welcome-anim {
    animation: welcomeFade 1.5s ease;
  }
  @keyframes welcomeFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========== ALERT SYSTEM ========== */
  body.alert-flash {
    animation: flashRed 0.4s ease infinite;
  }
  @keyframes flashRed {
    0%, 100% { background: #0a0a0f; }
    50% { background: rgba(255,23,68,0.2); }
  }

  .alert-pill {
    display: none;
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,23,68,0.9);
    color: #fff;
    padding: 8px 22px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    border-radius: 20px;
    z-index: 100;
    animation: pillPop 0.3s ease;
    box-shadow: 0 2px 20px rgba(255,23,68,0.6);
    white-space: nowrap;
  }
  .alert-pill.visible { display: flex; align-items: center; gap: 6px; }
  @keyframes pillPop {
    from { transform: translateX(-50%) scale(0.8); opacity: 0; }
    to { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  /* ========== MAIN LAYOUT ========== */
  .main {
    display: none;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 8px 12px 16px;
  }
  .main.show { display: flex; }

  /* ========== COMPACT LIMIT PANEL ========== */
  .limit-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 6px 10px;
    margin-bottom: 4px;
    max-width: 320px;
    width: 100%;
  }
  .limit-icon {
    font-size: 16px;
    opacity: 0.6;
  }
  .limit-input {
    background: transparent;
    border: none;
    color: #ffc400;
    font-size: 18px;
    font-weight: 700;
    width: 48px;
    text-align: center;
    padding: 0;
    outline: none;
    -moz-appearance: textfield;
  }
  .limit-input::-webkit-outer-spin-button,
  .limit-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
  }
  .limit-unit-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
  }
  .limit-auto-tag {
    font-size: 9px;
    background: rgba(0,200,255,0.15);
    color: #00c8ff;
    padding: 2px 8px;
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .limit-toggle-btn {
    background: rgba(255,255,255,0.06);
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    margin-left: auto;
  }
  .limit-toggle-btn.off {
    color: rgba(255,255,255,0.2);
    text-decoration: line-through;
  }

  /* ========== GAUGE ========== */
  .gauge-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
  }

  .speedo-wrap {
    position: relative;
  }

  canvas#gauge {
    display: block;
  }

  .speed-digital {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .speed-value {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .speed-value.alerting {
    animation: pulseText 0.4s ease infinite;
  }
  @keyframes pulseText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .speed-unit {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 360px;
    justify-content: space-between;
    margin-top: 4px;
  }

  .mini-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
    flex: 1;
  }
  .mini-card .lab {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.3);
  }
  .mini-card .num {
    font-size: 16px;
    font-weight: 600;
    margin-top: 2px;
  }

  .ctrl-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    max-width: 360px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-btn:hover {
    background: rgba(0,200,255,0.1);
    color: #00c8ff;
  }
  .ctrl-btn.active {
    background: rgba(0,200,255,0.12);
    border-color: rgba(0,200,255,0.3);
    color: #00c8ff;
  }

  .status-dot {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    text-align: center;
    margin-top: 4px;
  }
  .status-dot .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .dot.green { background: #00e676; box-shadow: 0 0 6px #00e676; }
  .dot.yellow { background: #ffc400; box-shadow: 0 0 6px #ffc400; }
  .dot.red { background: #ff1744; box-shadow: 0 0 6px #ff1744; }

  .warn-box {
    background: rgba(255,23,68,0.08);
    border: 1px solid rgba(255,23,68,0.2);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<!-- ===== WELCOME SCREEN ===== -->
<div class="welcome" id="welcomeScreen">
  <div class="welcome-gauge">
    <canvas id="welcomeCanvas" width="400" height="400"></canvas>
  </div>
  <div class="welcome-anim">
    <div class="welcome-title">Merhaba! 👋</div>
    <div class="welcome-sub">ARAÇ HIZ GÖSTERGESİ</div>
    <button class="welcome-start" onclick="dismissWelcome()">Başla</button>
  </div>
</div>

<!-- ===== ALERT PILL ===== -->
<div class="alert-pill" id="alertPill">⚠️ HIZ SINIRI AŞILDI</div>

<!-- ===== MAIN ===== -->
<div class="main" id="mainUI">
  <!-- Kompakt hız sınırı -->
  <div class="limit-bar">
    <span class="limit-icon">🚧</span>
    <input type="number" class="limit-input" id="limitInput" value="90" min="10" max="300" inputmode="numeric">
    <span class="limit-unit-label" id="limitUnitLabel">km/s</span>
    <span class="limit-auto-tag" id="autoTag" style="display:none">OTO</span>
    <button class="limit-toggle-btn" id="limitTglBtn" onclick="toggleLimit()">AÇIK</button>
  </div>

  <!-- Gauge -->
  <div class="gauge-area">
    <div class="speedo-wrap" id="speedoWrap">
      <canvas id="gauge" width="700" height="700"></canvas>
      <div class="speed-digital">
        <div class="speed-value" id="speedVal">0</div>
        <div class="speed-unit" id="speedUnit">KM/S</div>
      </div>
    </div>
  </div>

  <!-- Alt bilgi -->
  <div class="bottom-bar">
    <div class="mini-card">
      <div class="lab">Maks</div>
      <div class="num" id="maxSpeed">0</div>
    </div>
    <div class="mini-card">
      <div class="lab">Ort</div>
      <div class="num" id="avgSpeed">0</div>
    </div>
    <div class="mini-card">
      <div class="lab">Mesafe</div>
      <div class="num" id="distance">0</div>
    </div>
  </div>

  <div class="ctrl-row">
    <button class="ctrl-btn" id="btnKmh" onclick="setUnit('kmh')" style="font-weight:600">KM/S</button>
    <button class="ctrl-btn" id="btnMph" onclick="setUnit('mph')">MPH</button>
    <button class="ctrl-btn" onclick="testSound()">🔊</button>
    <button class="ctrl-btn" onclick="resetMax()">Sıfırla</button>
  </div>

  <div class="status-dot" id="status">
    <span class="dot yellow"></span> GPS bekleniyor
  </div>

  <div class="warn-box" id="warnBox">GPS desteklenmiyor – simülasyon modu</div>
</div>

<script>
// ============== WELCOME ANIMATION ==============
const wCvs = document.getElementById('welcomeCanvas');
const wCtx = wCvs.getContext('2d');
let wAngle = 0;
let wDir = 1;

function drawWelcomeGauge() {
  const w = wCvs.width, h = wCvs.height;
  const c = w/2, r = 150;
  const start = 0.75*Math.PI, end = 2.25*Math.PI, sweep = end-start;
  const na = start + wAngle * sweep;

  wCtx.clearRect(0,0,w,h);

  // Dış krom halka
  wCtx.beginPath();
  wCtx.arc(c,c,r+6,0,Math.PI*2);
  let grd = wCtx.createRadialGradient(c,c,r-10,c,c,r+12);
  grd.addColorStop(0,'rgba(60,60,70,0.6)');
  grd.addColorStop(0.5,'rgba(180,180,190,0.3)');
  grd.addColorStop(1,'rgba(40,40,50,0.8)');
  wCtx.strokeStyle = grd;
  wCtx.lineWidth = 10;
  wCtx.stroke();

  // Arka plan
  wCtx.beginPath();
  wCtx.arc(c,c,r,start,end);
  wCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  wCtx.lineWidth = 8;
  wCtx.stroke();

  // Renkli doluluk
  const ratio = wAngle;
  const segs = 60;
  for(let i=0;i<=Math.floor(ratio*segs);i++){
    const t=i/segs;
    const a1=start+t*sweep, a2=start+(t+1/segs)*sweep;
    const rc=t<0.5?{r:0,g:200,b:255}:t<0.75?{r:255,g:196,b:0}:{r:255,g:23,b:68};
    wCtx.beginPath();
    wCtx.arc(c,c,r,a1,a2+0.01);
    wCtx.strokeStyle=`rgb(${rc.r},${rc.g},${rc.b})`;
    wCtx.lineWidth=8;
    wCtx.lineCap='round';
    wCtx.stroke();
  }

  // İbre
  const nl=r-20;
  const nx=c+Math.cos(na)*nl, ny=c+Math.sin(na)*nl;
  const rc2=ratio<0.5?{r:0,g:200,b:255}:ratio<0.75?{r:255,g:196,b:0}:{r:255,g:23,b:68};
  wCtx.beginPath();wCtx.moveTo(c,c);wCtx.lineTo(nx,ny);
  wCtx.strokeStyle=`rgba(${rc2.r},${rc2.g},${rc2.b},0.3)`;wCtx.lineWidth=6;wCtx.lineCap='round';wCtx.stroke();
  wCtx.beginPath();wCtx.moveTo(c,c);wCtx.lineTo(nx,ny);
  wCtx.strokeStyle=`rgb(${rc2.r},${rc2.g},${rc2.b})`;wCtx.lineWidth=2.5;wCtx.lineCap='round';wCtx.stroke();

  // Merkez
  wCtx.beginPath();wCtx.arc(c,c,6,0,Math.PI*2);wCtx.fillStyle='#1a1a2e';wCtx.fill();
  wCtx.strokeStyle=`rgb(${rc2.r},${rc2.g},${rc2.b})`;wCtx.lineWidth=2;wCtx.stroke();

  wAngle += 0.008 * wDir;
  if(wAngle>=1) wDir=-1;
  if(wAngle<=0) wDir=1;
}

let welcomeAnim = setInterval(drawWelcomeGauge, 30);

function dismissWelcome() {
  clearInterval(welcomeAnim);
  document.getElementById('welcomeScreen').classList.add('hide');
  setTimeout(() => {
    document.getElementById('welcomeScreen').style.display='none';
    document.getElementById('mainUI').classList.add('show');
    initAudio();
    startGPS();
    resizeGauge();
  }, 800);
}

// ============== STATE ==============
const canvas = document.getElementById('gauge');
const ctx = canvas.getContext('2d');
let CW = 700, CH = 700;

let currentSpeed = 0, displaySpeed = 0;
let maxSpeedVal = 0, speedSum = 0, speedCount = 0;
let totalDist = 0, lastPos = null, lastTime = null;
let unit = 'kmh', maxGaugeKmh = 260;
let gpsActive = false, simMode = false, watchId = null;
let limitEnabled = true, speedLimit = 90;
let isAlerting = false, lastAlertTime = 0;
let audioCtx = null, audioSupported = true;
let lastKnownPos = null;

// ============== RESIZE ==============
function resizeGauge() {
  const area = document.querySelector('.gauge-area');
  const maxH = area.clientHeight;
  const maxW = area.clientWidth;
  const sz = Math.min(maxW, maxH, 500);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = sz + 'px';
  canvas.style.height = sz + 'px';
  canvas.width = sz * dpr;
  canvas.height = sz * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CW = sz; CH = sz;
}
window.addEventListener('resize', resizeGauge);

// ============== AUDIO ==============
function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  } catch(e) { audioSupported = false; }
}

function playBeep(freq, dur, vol) {
  if(!audioCtx) initAudio();
  if(!audioSupported||!audioCtx) return false;
  try {
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=freq||880;
    g.gain.value=vol||0.3;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.2));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime+(dur||0.2));
    return true;
  } catch(e) { return false; }
}

function playAlertSound() {
  const now=Date.now();
  if(now-lastAlertTime<1500) return;
  lastAlertTime=now;
  const s1=playBeep(900,0.15,0.4);
  setTimeout(()=>{const s2=playBeep(1100,0.2,0.5);if(!s1&&!s2)visualFallback();},180);
}

function testSound() {
  initAudio();
  playBeep(660,0.3,0.3);
  setTimeout(()=>playBeep(880,0.3,0.3),350);
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
}

// ============== ALERT ==============
function checkAlert() {
  if(!limitEnabled) { stopAlert(); return; }
  const eff = unit==='mph' ? speedLimit*1.60934 : speedLimit;
  if(displaySpeed > eff) {
    if(!isAlerting) { isAlerting=true; startAlert(); }
    playAlertSound();
  } else if(isAlerting) { stopAlert(); }
}

function startAlert() {
  document.body.classList.add('alert-flash');
  document.getElementById('alertPill').classList.add('visible');
  document.getElementById('speedVal').classList.add('alerting');
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  playAlertSound();
  if(!window._ai) window._ai=setInterval(()=>{if(isAlerting){playAlertSound();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},2000);
}

function stopAlert() {
  isAlerting=false;
  document.body.classList.remove('alert-flash');
  document.getElementById('alertPill').classList.remove('visible');
  document.getElementById('speedVal').classList.remove('alerting');
  if(navigator.vibrate) navigator.vibrate(0);
  if(window._ai){clearInterval(window._ai);window._ai=null;}
}

function visualFallback() {
  const p=document.getElementById('alertPill');
  p.style.background='rgba(255,100,0,0.9)';
  p.textContent='⚠️ HIZ AŞIMI (sessiz)';
  setTimeout(()=>{p.style.background='';p.textContent='⚠️ HIZ SINIRI AŞILDI';},5000);
}

// ============== LIMIT ==============
function toggleLimit() {
  limitEnabled=!limitEnabled;
  const b=document.getElementById('limitTglBtn');
  b.textContent=limitEnabled?'AÇIK':'KAPALI';
  b.classList.toggle('off',!limitEnabled);
  if(!limitEnabled) stopAlert();
}

document.getElementById('limitInput').addEventListener('input',function(){
  let v=parseInt(this.value);
  if(!isNaN(v)&&v>=10&&v<=300){speedLimit=v;document.getElementById('autoTag').style.display='none';}
});
document.getElementById('limitInput').addEventListener('change',function(){
  let v=parseInt(this.value);if(isNaN(v)||v<10)v=10;if(v>300)v=300;this.value=v;speedLimit=v;
});

// ============== UNIT ==============
function setUnit(u) {
  unit=u;
  document.getElementById('btnKmh').classList.toggle('active',u==='kmh');
  document.getElementById('btnMph').classList.toggle('active',u==='mph');
  document.getElementById('speedUnit').textContent=u==='kmh'?'KM/S':'MPH';
  document.getElementById('limitUnitLabel').textContent=u==='kmh'?'km/s':'mph';
  if(u==='mph'){
    const cv=Math.round(speedLimit*0.621371);
    document.getElementById('limitInput').value=cv;speedLimit=cv;
    maxGaugeKmh=260;
  } else {
    const cv=Math.round(speedLimit/0.621371);
    document.getElementById('limitInput').value=cv;speedLimit=cv;
    maxGaugeKmh=260;
  }
}

// ============== LOCATION-BASED SPEED LIMIT ==============
let limitCheckTimeout = null;

async function fetchSpeedLimit(lat, lon) {
  try {
    // Overpass API: en yakın yolu ve maxspeed bilgisini bul
    const query = `[out:json];way(around:80,${lat},${lon})["maxspeed"];out tags;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    
    document.getElementById('autoTag').style.display = 'inline';
    document.getElementById('autoTag').textContent = '...';
    
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('API hatası');
    const data = await resp.json();
    
    if(data.elements && data.elements.length > 0) {
      // En yakın yoldaki maxspeed'i al
      for(const el of data.elements) {
        if(el.tags && el.tags.maxspeed) {
          let ms = el.tags.maxspeed;
          // Bazı maxspeed değerleri "30", "50 mph", "TR:urban" gibi olabilir
          if(ms.includes('mph')) {
            ms = parseInt(ms);
            if(!isNaN(ms)) ms = Math.round(ms * 1.60934); // mph -> kmh
          } else if(ms === 'TR:urban' || ms === 'urban') {
            ms = 50; // Türkiye şehir içi
          } else if(ms === 'TR:rural' || ms === 'rural') {
            ms = 90; // Türkiye şehir dışı
          } else if(ms === 'TR:motorway' || ms === 'motorway') {
            ms = 120; // Türkiye otoyol
          } else if(ms === 'TR:trunk' || ms === 'trunk') {
            ms = 110;
          } else if(ms === 'TR:living_street' || ms === 'living_street') {
            ms = 20;
          } else {
            ms = parseInt(ms);
          }
          
          if(!isNaN(ms) && ms > 0) {
            const finalVal = unit === 'mph' ? Math.round(ms * 0.621371) : ms;
            speedLimit = finalVal;
            document.getElementById('limitInput').value = finalVal;
            document.getElementById('autoTag').textContent = 'OTO ✓';
            document.getElementById('autoTag').style.background = 'rgba(0,230,118,0.15)';
            document.getElementById('autoTag').style.color = '#00e676';
            return;
          }
        }
      }
    }
    // Speed limit bulunamadı
    document.getElementById('autoTag').textContent = 'OTO –';
    document.getElementById('autoTag').style.background = 'rgba(255,196,0,0.12)';
    document.getElementById('autoTag').style.color = '#ffc400';
  } catch(e) {
    console.warn('Hız sınırı alınamadı:', e);
    document.getElementById('autoTag').textContent = 'OTO ✗';
    document.getElementById('autoTag').style.background = 'rgba(255,23,68,0.1)';
    document.getElementById('autoTag').style.color = '#ff5252';
  }
}

// ============== REALISTIC GAUGE ==============
function drawGauge(speed) {
  const w=CW, h=CH;
  const cX=w/2, cY=h*0.48, R=w*0.37;
  const start=0.8*Math.PI, end=2.2*Math.PI, sweep=end-start;
  const maxV = unit==='mph' ? 160 : 260;
  const ratio=Math.min(speed/maxV,1);
  const na=start+ratio*sweep;

  // Hız sınırı oranı
  const eff=unit==='mph'?speedLimit*1.60934:speedLimit;
  const lRatio=Math.min(eff/maxV,1);
  const lAngle=start+lRatio*sweep;

  ctx.clearRect(0,0,w,h);

  // ---- DIŞ KROM HALKA ----
  ctx.save();
  ctx.beginPath();
  ctx.arc(cX,cY,R+12,0,Math.PI*2);
  let chrGrd=ctx.createLinearGradient(cX-R,cY-R,cX+R,cY+R);
  chrGrd.addColorStop(0,'#3a3a44');
  chrGrd.addColorStop(0.3,'#8a8a95');
  chrGrd.addColorStop(0.5,'#c8c8d0');
  chrGrd.addColorStop(0.7,'#8a8a95');
  chrGrd.addColorStop(1,'#3a3a44');
  ctx.strokeStyle=chrGrd;
  ctx.lineWidth=8;
  ctx.stroke();

  // İç krom halka
  ctx.beginPath();
  ctx.arc(cX,cY,R+4,0,Math.PI*2);
  chrGrd=ctx.createLinearGradient(cX-R,cY-R,cX+R,cY+R);
  chrGrd.addColorStop(0,'#2a2a30');
  chrGrd.addColorStop(0.4,'#555560');
  chrGrd.addColorStop(0.6,'#555560');
  chrGrd.addColorStop(1,'#2a2a30');
  ctx.strokeStyle=chrGrd;
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.restore();

  // ---- KADRAN YÜZEY ----
  ctx.save();
  ctx.beginPath();
  ctx.arc(cX,cY,R,0,Math.PI*2);
  let faceGrd=ctx.createRadialGradient(cX,cY-R*0.3,0,cX,cY,R);
  faceGrd.addColorStop(0,'#1e1e28');
  faceGrd.addColorStop(0.7,'#121218');
  faceGrd.addColorStop(1,'#0a0a10');
  ctx.fillStyle=faceGrd;
  ctx.fill();
  ctx.restore();

  // ---- KIRMIZI ZON (yüksek hız bölgesi) ----
  const redStart = 0.75;
  ctx.beginPath();
  ctx.arc(cX,cY,R,start+redStart*sweep,end);
  ctx.strokeStyle='rgba(255,23,68,0.08)';
  ctx.lineWidth=R*0.35;
  ctx.stroke();

  // ---- ARKA PLAN ARC ----
  ctx.beginPath();
  ctx.arc(cX,cY,R,start,end);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=6;
  ctx.lineCap='butt';
  ctx.stroke();

  // ---- RENKLİ ARC ----
  const segs=120;
  const filled=Math.floor(ratio*segs);
  for(let i=0;i<=filled;i++){
    const t=i/segs;
    const a1=start+t*sweep, a2=start+(t+1/segs)*sweep;
    let rc;
    if(t<0.35) rc={r:0,g:180,b:255};
    else if(t<0.6) rc={r:0,g:220,b:100};
    else if(t<0.75) rc={r:255,g:196,b:0};
    else rc={r:255,g:23,b:68};
    ctx.beginPath();
    ctx.arc(cX,cY,R,a1,a2+0.005);
    ctx.strokeStyle=`rgb(${rc.r},${rc.g},${rc.b})`;
    ctx.lineWidth=6;
    ctx.lineCap='butt';
    ctx.stroke();
  }

  // ---- HIZ SINIR ÇİZGİSİ ----
  if(limitEnabled){
    const lx1=cX+Math.cos(lAngle)*(R-22);
    const ly1=cY+Math.sin(lAngle)*(R-22);
    const lx2=cX+Math.cos(lAngle)*(R+8);
    const ly2=cY+Math.sin(lAngle)*(R+8);
    ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(lx2,ly2);
    if(isAlerting){
      ctx.strokeStyle='rgba(255,23,68,0.9)';ctx.lineWidth=3;
      ctx.shadowColor='#ff1744';ctx.shadowBlur=12;
    } else {
      ctx.strokeStyle='rgba(255,196,0,0.5)';ctx.lineWidth=2;
      ctx.shadowColor='#ffc400';ctx.shadowBlur=6;
    }
    ctx.stroke();ctx.shadowBlur=0;
  }

  // ---- TICK MARKS ----
  const totalTicks = unit==='mph' ? 32 : 52;
  const majorEvery = unit==='mph' ? 4 : 4;
  for(let i=0;i<=totalTicks;i++){
    const t=i/totalTicks;
    const ang=start+t*sweep;
    const isMajor=i%majorEvery===0;
    const isMid=i%(majorEvery/2)===0 && !isMajor;
    const iR=isMajor?R-28:isMid?R-18:R-12;
    const oR=R-5;
    const x1=cX+Math.cos(ang)*iR, y1=cY+Math.sin(ang)*iR;
    const x2=cX+Math.cos(ang)*oR, y2=cY+Math.sin(ang)*oR;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=isMajor?'rgba(255,255,255,0.65)':isMid?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.12)';
    ctx.lineWidth=isMajor?2.5:isMid?1.5:0.8;
    ctx.lineCap='round';
    ctx.stroke();

    if(isMajor){
      const val=Math.round(t*maxV);
      const lR=R-40;
      const lx=cX+Math.cos(ang)*lR, ly=cY+Math.sin(ang)*lR;
      const inRed=t>=0.75;
      ctx.font=`600 ${w*0.035}px Segoe UI,Arial`;
      ctx.fillStyle=inRed?'rgba(255,80,100,0.7)':'rgba(255,255,255,0.45)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(val,lx,ly);
    }
  }

  // ---- İBRE ----
  const nLen=R-30;
  const nx=cX+Math.cos(na)*nLen, ny=cY+Math.sin(na)*nLen;
  // İbre kontra ağırlık
  const bAngle=na+Math.PI;
  const bLen=22;
  const bx=cX+Math.cos(bAngle)*bLen, by=cY+Math.sin(bAngle)*bLen;

  // İbre gölge
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  // İbre gövde (uç)
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(nx,ny);
  let nColor;
  if(ratio<0.35) nColor='#00b4ff';
  else if(ratio<0.6) nColor='#00dc64';
  else if(ratio<0.75) nColor='#ffc400';
  else nColor='#ff1744';
  ctx.strokeStyle=nColor;ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.restore();

  // Kontra (kalın kısım)
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(cX,cY);
  ctx.strokeStyle='rgba(200,200,210,0.6)';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();

  // Merkez kapak
  ctx.beginPath();ctx.arc(cX,cY,10,0,Math.PI*2);
  let capGrd=ctx.createRadialGradient(cX-2,cY-2,0,cX,cY,10);
  capGrd.addColorStop(0,'#aaa');capGrd.addColorStop(0.5,'#555');capGrd.addColorStop(1,'#222');
  ctx.fillStyle=capGrd;ctx.fill();
  ctx.strokeStyle='rgba(200,200,210,0.4)';ctx.lineWidth=1.5;ctx.stroke();

  // Merkez kırmızı nokta
  ctx.beginPath();ctx.arc(cX,cY,3,0,Math.PI*2);
  ctx.fillStyle=nColor;ctx.fill();
}

// ============== DISPLAY UPDATE ==============
function updateDisplay(){
  displaySpeed+=(currentSpeed-displaySpeed)*0.12;
  const dv=unit==='mph'?displaySpeed*0.621371:displaySpeed;
  const shown=Math.round(dv);

  document.getElementById('speedVal').textContent=shown;

  const maxV=unit==='mph'?160:260;
  const ratio=Math.min(displaySpeed/maxV,1);
  let nc;
  if(ratio<0.35)nc='rgb(0,180,255)';
  else if(ratio<0.6)nc='rgb(0,220,100)';
  else if(ratio<0.75)nc='rgb(255,196,0)';
  else nc='rgb(255,23,68)';

  document.getElementById('speedVal').style.color=isAlerting?'#ff1744':nc;

  if(displaySpeed>maxSpeedVal){
    maxSpeedVal=displaySpeed;
    document.getElementById('maxSpeed').textContent=Math.round(unit==='mph'?maxSpeedVal*0.621371:maxSpeedVal);
  }
  speedSum+=displaySpeed;speedCount++;
  document.getElementById('avgSpeed').textContent=Math.round(unit==='mph'?(speedSum/speedCount)*0.621371:speedSum/speedCount);

  if(unit==='mph'){
    const mi=totalDist*0.621371;
    document.getElementById('distance').textContent=mi<1?(mi*5280).toFixed(0)+'ft':mi.toFixed(1)+'mi';
  } else {
    document.getElementById('distance').textContent=totalDist<1?(totalDist*1000).toFixed(0)+'m':totalDist.toFixed(1)+'km';
  }

  drawGauge(dv);
  checkAlert();
}

function resetMax(){
  maxSpeedVal=0;speedSum=0;speedCount=0;totalDist=0;lastPos=null;lastTime=null;
  stopAlert();
  document.getElementById('maxSpeed').textContent='0';
  document.getElementById('avgSpeed').textContent='0';
  document.getElementById('distance').textContent='0';
  document.getElementById('speedVal').textContent='0';currentSpeed=0;displaySpeed=0;
}

// ============== GPS ==============
function startGPS(){
  if(gpsActive) return;
  if(!navigator.geolocation){
    document.getElementById('warnBox').style.display='block';
    startSimulation();
    return;
  }

  const opt={enableHighAccuracy:true,maximumAge:0,timeout:10000};
  watchId=navigator.geolocation.watchPosition(
    (pos)=>{
      gpsActive=true;
      updateStatus('green','GPS aktif');

      if(pos.coords.speed!==null&&pos.coords.speed>=0){
        currentSpeed=pos.coords.speed*3.6;
      } else if(lastPos&&lastTime){
        const d=haversine(lastPos.coords.latitude,lastPos.coords.longitude,pos.coords.latitude,pos.coords.longitude);
        const dt=(pos.timestamp-lastTime)/1000;
        if(dt>0) currentSpeed=(d/dt)*3.6;
      }

      if(lastPos){
        totalDist+=haversine(lastPos.coords.latitude,lastPos.coords.longitude,pos.coords.latitude,pos.coords.longitude);
      }
      lastPos=pos;lastTime=pos.timestamp;

      // Konuma göre hız sınırı (her 30 saniyede bir kontrol)
      if(!limitCheckTimeout && limitEnabled) {
        limitCheckTimeout = setTimeout(() => {
          fetchSpeedLimit(pos.coords.latitude, pos.coords.longitude);
          limitCheckTimeout = setTimeout(() => { limitCheckTimeout = null; }, 30000);
        }, 2000);
      }
    },
    (err)=>{
      console.warn('GPS err:',err);
      updateStatus('red','GPS hatası');
      document.getElementById('warnBox').style.display='block';
      startSimulation();
    },
    opt
  );
}

function haversine(a,b,c,d){
  const R=6371,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function updateStatus(col,txt){
  document.getElementById('status').innerHTML=`<span class="dot ${col}"></span> ${txt}`;
}

// ============== SIMULATION ==============
function startSimulation(){
  simMode=true;updateStatus('yellow','Simülasyon');
  let ss=0,tgt=80,ph='accel';
  setInterval(()=>{
    if(ph==='accel'){ss+=Math.random()*4;if(ss>=tgt)ph='cruise';}
    else if(ph==='cruise'){ss+=(Math.random()-0.5)*3;if(Math.random()<0.02){tgt=30+Math.random()*170;ph='change';}}
    else if(ph==='change'){ss+=(tgt-ss)*0.05+(Math.random()-0.5);if(Math.abs(ss-tgt)<5)ph='cruise';}
    ss=Math.max(0,Math.min(ss,250));currentSpeed=ss;totalDist+=ss/3600;
  },500);
}

// ============== MAIN LOOP ==============
function animate(){updateDisplay();requestAnimationFrame(animate);}

// İlk kadran çizimi
drawGauge(0);
animate();
</script>
