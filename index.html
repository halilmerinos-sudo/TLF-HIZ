<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hız Göstergesi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
  }

  .speedo-wrapper {
    position: relative;
    width: 340px;
    height: 340px;
  }

  canvas#gauge {
    width: 340px;
    height: 340px;
  }

  .speed-digital {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .speed-value {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(0,200,255,0.5);
    transition: color 0.3s;
  }

  .speed-unit {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    margin-top: 4px;
  }

  .info-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  .info-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 22px;
    text-align: center;
    min-width: 130px;
  }

  .info-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 4px;
  }

  .info-card .val {
    font-size: 22px;
    font-weight: 600;
  }

  .unit-toggle {
    display: flex;
    gap: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .unit-toggle button {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }

  .unit-toggle button.active {
    background: rgba(0,200,255,0.2);
    color: #00c8ff;
  }

  .status {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    margin-top: 6px;
  }

  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .dot.green { background: #00e676; box-shadow: 0 0 8px #00e676; }
  .dot.yellow { background: #ffc400; box-shadow: 0 0 8px #ffc400; }
  .dot.red { background: #ff1744; box-shadow: 0 0 8px #ff1744; }

  .start-btn {
    background: linear-gradient(135deg, #00c8ff, #0070ff);
    border: none;
    color: #fff;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.2s, box-shadow 0.3s;
  }

  .start-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px rgba(0,200,255,0.4);
  }

  .start-btn:active { transform: scale(0.97); }

  .warning-box {
    background: rgba(255,23,68,0.1);
    border: 1px solid rgba(255,23,68,0.3);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    display: none;
  }

  .max-speed-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  .max-speed-bar button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .max-speed-bar button:hover {
    background: rgba(255,196,0,0.15);
    color: #ffc400;
  }

  @media (max-width: 380px) {
    .speedo-wrapper { width: 280px; height: 280px; }
    canvas#gauge { width: 280px; height: 280px; }
    .speed-value { font-size: 56px; }
    .info-card { min-width: 110px; padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="speedo-wrapper">
    <canvas id="gauge" width="680" height="680"></canvas>
    <div class="speed-digital">
      <div class="speed-value" id="speedVal">0</div>
      <div class="speed-unit" id="speedUnit">KM/S</div>
    </div>
  </div>

  <div class="unit-toggle">
    <button id="btnKmh" class="active" onclick="setUnit('kmh')">KM/S</button>
    <button id="btnMph" onclick="setUnit('mph')">MPH</button>
  </div>

  <div class="info-bar">
    <div class="info-card">
      <div class="label">Maks. Hız</div>
      <div class="val" id="maxSpeed">0</div>
    </div>
    <div class="info-card">
      <div class="label">Ort. Hız</div>
      <div class="val" id="avgSpeed">0</div>
    </div>
    <div class="info-card">
      <div class="label">Mesafe</div>
      <div class="val" id="distance">0 km</div>
    </div>
  </div>

  <div class="max-speed-bar">
    <button onclick="resetMax()">Maks. Sıfırla</button>
    <button onclick="resetAll()">Tümünü Sıfırla</button>
  </div>

  <div class="status" id="status">
    <span class="dot yellow"></span> GPS bekleniyor...
  </div>

  <button class="start-btn" id="startBtn" onclick="startGPS()">Hız Göstergesini Başlat</button>

  <div class="warning-box" id="warnBox">
    ⚠️ GPS hız verisi tarayıcınızda desteklenmiyor. Simülasyon modu aktif.
  </div>
</div>

<script>
const canvas = document.getElementById('gauge');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W / 2, cy = H / 2, R = 270;

let currentSpeed = 0;
let displaySpeed = 0;
let maxSpeedVal = 0;
let speedSum = 0, speedCount = 0;
let totalDist = 0;
let lastPos = null, lastTime = null;
let unit = 'kmh'; // kmh or mph
let maxGauge = 220; // max km/h on gauge
let gpsActive = false;
let simMode = false;
let watchId = null;

function setUnit(u) {
  unit = u;
  document.getElementById('btnKmh').classList.toggle('active', u === 'kmh');
  document.getElementById('btnMph').classList.toggle('active', u === 'mph');
  document.getElementById('speedUnit').textContent = u === 'kmh' ? 'KM/S' : 'MPH';
  if (u === 'mph') maxGauge = 140; else maxGauge = 220;
  drawGauge(displaySpeed);
}

function kToM(k) { return k * 0.621371; }
function displayVal(kmh) { return unit === 'mph' ? kToM(kmh) : kmh; }

function getSpeedColor(ratio) {
  if (ratio < 0.4) return { r: 0, g: 200, b: 255 };       // cyan
  if (ratio < 0.65) return { r: 0, g: 230, b: 118 };      // green
  if (ratio < 0.82) return { r: 255, g: 196, b: 0 };     // yellow
  return { r: 255, g: 23, b: 68 };                        // red
}

function drawGauge(speed) {
  const maxV = unit === 'mph' ? 140 : 220;
  const ratio = Math.min(speed / maxV, 1);
  const startAngle = 0.75 * Math.PI;
  const endAngle = 2.25 * Math.PI;
  const sweepAngle = endAngle - startAngle;
  const needleAngle = startAngle + ratio * sweepAngle;

  ctx.clearRect(0, 0, W, H);

  // Outer ring glow
  ctx.beginPath();
  ctx.arc(cx, cy, R + 8, startAngle, endAngle);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 18;
  ctx.stroke();

  // Background arc
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, endAngle);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Colored arc (gradient along speed)
  const segments = 100;
  const filled = Math.floor(ratio * segments);
  for (let i = 0; i <= filled; i++) {
    const t = i / segments;
    const a1 = startAngle + t * sweepAngle;
    const a2 = startAngle + (t + 1/segments) * sweepAngle;
    const c = getSpeedColor(t);
    ctx.beginPath();
    ctx.arc(cx, cy, R, a1, a2 + 0.01);
    ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Tick marks & labels
  const tickCount = unit === 'mph' ? 14 : 22;
  for (let i = 0; i <= tickCount; i++) {
    const t = i / tickCount;
    const angle = startAngle + t * sweepAngle;
    const isMajor = i % 2 === 0;
    const innerR = isMajor ? R - 36 : R - 24;
    const outerR = R - 14;

    const x1 = cx + Math.cos(angle) * innerR;
    const y1 = cy + Math.sin(angle) * innerR;
    const x2 = cx + Math.cos(angle) * outerR;
    const y2 = cy + Math.sin(angle) * outerR;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = isMajor ? 3 : 1.5;
    ctx.lineCap = 'round';
    ctx.stroke();

    if (isMajor) {
      const val = Math.round(t * maxV);
      const labelR = R - 54;
      const lx = cx + Math.cos(angle) * labelR;
      const ly = cy + Math.sin(angle) * labelR;
      ctx.font = '600 20px Segoe UI, Arial';
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(val, lx, ly);
    }
  }

  // Needle
  const needleLen = R - 40;
  const nx = cx + Math.cos(needleAngle) * needleLen;
  const ny = cy + Math.sin(needleAngle) * needleLen;

  // Needle glow
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(nx, ny);
  const nc = getSpeedColor(ratio);
  ctx.strokeStyle = `rgba(${nc.r},${nc.g},${nc.b},0.3)`;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Needle body
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(nx, ny);
  ctx.strokeStyle = `rgb(${nc.r},${nc.g},${nc.b})`;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Center cap
  ctx.beginPath();
  ctx.arc(cx, cy, 16, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = `rgb(${nc.r},${nc.g},${nc.b})`;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Inner glow dot
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${nc.r},${nc.g},${nc.b})`;
  ctx.fill();
}

function updateDisplay() {
  const dv = displayVal(displaySpeed);
  const shown = Math.round(dv);
  
  // Smooth animation
  const diff = shown - parseFloat(document.getElementById('speedVal').textContent);
  const step = diff * 0.3;
  displaySpeed += (currentSpeed - displaySpeed) * 0.15;
  
  document.getElementById('speedVal').textContent = Math.round(displayVal(displaySpeed));
  
  // Color
  const ratio = Math.min(displaySpeed / (unit === 'mph' ? 140 : 220), 1);
  const nc = getSpeedColor(ratio);
  document.getElementById('speedVal').style.color = `rgb(${nc.r},${nc.g},${nc.b})`;
  
  // Max
  if (displaySpeed > maxSpeedVal) {
    maxSpeedVal = displaySpeed;
    document.getElementById('maxSpeed').textContent = Math.round(displayVal(maxSpeedVal));
  }
  
  // Avg
  speedSum += displaySpeed;
  speedCount++;
  document.getElementById('avgSpeed').textContent = Math.round(displayVal(speedSum / speedCount));
  
  drawGauge(displayVal(displaySpeed));
}

function resetMax() {
  maxSpeedVal = 0;
  document.getElementById('maxSpeed').textContent = '0';
}

function resetAll() {
  maxSpeedVal = 0;
  speedSum = 0;
  speedCount = 0;
  totalDist = 0;
  lastPos = null;
  lastTime = null;
  currentSpeed = 0;
  displaySpeed = 0;
  document.getElementById('maxSpeed').textContent = '0';
  document.getElementById('avgSpeed').textContent = '0';
  document.getElementById('distance').textContent = '0 km';
  document.getElementById('speedVal').textContent = '0';
}

function startGPS() {
  if (gpsActive) return;
  
  const btn = document.getElementById('startBtn');
  btn.style.display = 'none';
  
  if (!navigator.geolocation) {
    document.getElementById('warnBox').style.display = 'block';
    startSimulation();
    return;
  }
  
  const options = {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 10000
  };

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      gpsActive = true;
      updateStatus('green', 'GPS aktif');
      
      // Speed from GPS (m/s -> km/h)
      if (pos.coords.speed !== null && pos.coords.speed >= 0) {
        currentSpeed = pos.coords.speed * 3.6; // m/s to km/h
      } else {
        // Calculate speed from position changes
        if (lastPos && lastTime) {
          const d = haversine(
            lastPos.coords.latitude, lastPos.coords.longitude,
            pos.coords.latitude, pos.coords.longitude
          );
          const dt = (pos.timestamp - lastTime) / 1000;
          if (dt > 0) currentSpeed = (d / dt) * 3.6;
        }
      }
      
      // Distance
      if (lastPos) {
        const d = haversine(
          lastPos.coords.latitude, lastPos.coords.longitude,
          pos.coords.latitude, pos.coords.longitude
        );
        totalDist += d;
        const distDisplay = totalDist < 1 ? (totalDist * 1000).toFixed(0) + ' m' : totalDist.toFixed(1) + ' km';
        if (unit === 'mph') {
          const mi = totalDist * 0.621371;
          document.getElementById('distance').textContent = mi < 1 ? (mi * 5280).toFixed(0) + ' ft' : mi.toFixed(1) + ' mi';
        } else {
          document.getElementById('distance').textContent = distDisplay;
        }
      }
      
      lastPos = pos;
      lastTime = pos.timestamp;
    },
    (err) => {
      console.warn('GPS error:', err);
      updateStatus('red', 'GPS hatası');
      document.getElementById('warnBox').style.display = 'block';
      startSimulation();
    },
    options
  );n}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateStatus(color, text) {
  document.getElementById('status').innerHTML = `<span class="dot ${color}"></span> ${text}`;
}

function startSimulation() {
  simMode = true;
  updateStatus('yellow', 'Simülasyon modu');
  
  let simSpeed = 0;
  let target = 60;
  let phase = 'accel';
  
  setInterval(() => {
    if (phase === 'accel') {
      simSpeed += (Math.random() * 3);
      if (simSpeed >= target) phase = 'cruise';
    } else if (phase === 'cruise') {
      simSpeed += (Math.random() - 0.5) * 2;
      if (Math.random() < 0.01) { target = Math.random() * 140; phase = 'change'; }
    } else if (phase === 'change') {
      simSpeed += (target - simSpeed) * 0.05 + (Math.random() - 0.5);
      if (Math.abs(simSpeed - target) < 5) phase = 'cruise';
    }
    simSpeed = Math.max(0, Math.min(simSpeed, 220));
    currentSpeed = simSpeed;
    totalDist += simSpeed / 3600;
    const distDisplay = totalDist < 1 ? (totalDist * 1000).toFixed(0) + ' m' : totalDist.toFixed(1) + ' km';
    if (unit === 'mph') {
      const mi = totalDist * 0.621371;
      document.getElementById('distance').textContent = mi < 1 ? (mi * 5280).toFixed(0) + ' ft' : mi.toFixed(1) + ' mi';
    } else {
      document.getElementById('distance').textContent = distDisplay;
    }
  }, 500);
}

// Animation loop
function animate() {
  updateDisplay();
  requestAnimationFrame(animate);
}

// Initial draw
drawGauge(0);
animate();
</script>
</body>
</html>
